<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>AMC Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
body{margin:0;background:#f4f7fc;color:#17223d;font:400 17px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){body{background:#0e1525;color:#e8edf8}}
#boot{max-width:720px;margin:0 auto;padding:40px 16px;color:#566280}
</style>
</head>
<body>
<div id="boot">Loading your problems…</div>
<script>
/* This page only loads the practice app. The app's code and the problems come from the family's
   Google Apps Script. No Google sign-in is ever sent (credentials are omitted). */
(function () {
  var API = "https://script.google.com/macros/s/AKfycbzE2ZNVY0S5LD1EXSEk63LFtIK_E1aXq6expD73ZOGdIQ-ADFBCBX3TGQCXBK83yyRb/exec";
  var q = new URLSearchParams(location.search), st = (q.get("student") || "").toLowerCase(), k = q.get("k") || "";
  try { if (st && k) localStorage.setItem("amc.k." + st, k); else if (st) k = localStorage.getItem("amc.k." + st) || ""; } catch (e) {}
  window.BOOT = { api: API, student: st, key: k };
  var boot = document.getElementById("boot");
  if (!st) { boot.textContent = "Please open your own practice link."; return; }
  fetch(API + "?api=1&app=1&student=" + encodeURIComponent(st) + "&k=" + encodeURIComponent(k) + "&t=" + Date.now(), { credentials: "omit", cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); })
    .then(function (d) {
      if (!d.appJs) throw new Error("no app");
      var code = d.appJs; delete d.appJs; window.BOOT.data = d;
      var s = document.createElement("script"); s.text = code; document.body.appendChild(s);
    })
    .catch(function () { boot.textContent = "Your problems could not load. Check the internet connection and refresh this page."; });
})();
</script>
</body>
</html>
